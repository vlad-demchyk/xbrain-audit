  SYNTHETIC FIXTURE. Not captured from a tenant: every name, text, address
  and custom GUID here is invented. Microsoft's own web part type ids
  (PageTitle, QuickLinks) are the public ones.

  The *structure* follows the rendered DOM of a live SharePoint Online page
  after every lazy web part was scrolled into view: the chrome carries
  `data-sp-feature-tag` too (with instance ids starting with `_`), every web
  part sits in a `CanvasControl`, its tag reads `<Alias> web part (<title>)`,
  its viewport id says `internal` (Microsoft) / `external` (app catalog) /
  `unknown` (not rendered), placeholders are present and empty unless an
  extension filled them, and an SPFx part may draw its markup into the chrome
  where only its CSS module classes (`<name>_<8 hex>`) say whose it is.

  Planted defects, and whose they are:
  * suite bar, app bar, site header, command bar, comments, footer, canvas
    wrappers: Microsoft's - never reported;
  * Text web part: the author's rich text - every rule (heading jump h2->h4,
    a vague link);
  * title area (PageTitle): author content in Microsoft markup - its banner
    has no alt (reported), a positive tabindex on the byline (skipped);
  * Quick links: author content in a Microsoft part - an empty link
    (reported), a positive tabindex in the part's own markup (skipped);
  * "Contoso News Carousel": a custom SPFx part placed twice - image without
    alt and a positive tabindex in both (reported, named);
  * "Contoso Header": a custom part whose canvas control is empty because it
    draws its header into the chrome - the header's image has no alt
    (reported, bound to the part by its CSS module stem);
  * "Contoso Events": placed and not rendered - nothing to audit, listed;
  * a pop-up an SPFx part appends to <body>: a button with no name
    (reported, named by its CSS module);
  * TopContent / Bottom placeholders filled by an application customizer:
    image without alt (reported); the empty Top placeholder is not a zone.
-->
