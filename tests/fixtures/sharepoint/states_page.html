<!doctype html>
<!--
  SYNTHETIC FIXTURE for the browser pass on SharePoint (states, measurements,
  HTML_CodeSniffer). Not captured from a tenant: every name, text, address
  and GUID is invented. The structure follows `modern_page.html` beside it.

  Planted, and where each must end up:
  * `#spCommandBar` (an excluded chrome region): a button with no focus
    style and an image with no alt - never examined, never reported;
  * `#msPageToolbar` (Microsoft's, outside every named region and every
    zone): a link with no focus style - found, dropped as Microsoft's;
  * the site header's navigation: nine links and no skip link -
    `no-skip-link`, counted as Microsoft's, never blamed on a part;
  * "Contoso Tiles" (custom SPFx): a link with no focus style, a button whose
    focus turns its fill pale under white text, an image with no alt, an
    image above the fold and one far below it - all placed in the part;
  * Text web part: a link with a strong focus ring, and a button whose
    focus turns it black with white text - nothing.
-->
